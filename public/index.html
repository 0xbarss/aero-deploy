<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeroDeploy</title>
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/dashboard.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>AeroDeploy</h1>
      <p>Releases on this server</p>
    </header>
    <section id="upload" class="upload" aria-label="Upload a release"></section>
    <main id="app" aria-busy="true">
      <p class="note">Loading releases…</p>
      <noscript><p class="note">The release list needs JavaScript.</p></noscript>
    </main>
    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
